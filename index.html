<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Lab — Audio Synthesizer & Visualizer | QuickUtils</title>
    <meta name="description" content="Create sounds with an interactive synthesizer, visualize audio waveforms in real-time, build beat sequences, and experiment with audio effects.">
    <meta name="keywords" content="synthesizer, audio, waveform, sound, music, oscillator, effects, visualizer, QuickUtils">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://quickutils.top/sound-lab/">
    <meta property="og:title" content="Sound Lab — Audio Synthesizer & Visualizer | QuickUtils">
    <meta property="og:description" content="Interactive audio synthesizer with real-time waveform visualization and effects.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔊</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar"><div class="container nav-inner">
    <a href="/" class="brand">🔊 <span>SoundLab</span></a>
    <div class="nav-links">
        <a href="https://ko-fi.com/dayatin" target="_blank" rel="noopener" class="kofi-link">☕ Support</a>
        <a href="https://quickutils.top" target="_blank">QuickUtils</a>
    </div>
    <button class="theme-btn" id="themeBtn">🌙</button>
</div></nav>
<main class="container">
    <section class="hero">
        <h1><span class="gradient-text">Sound Lab</span></h1>
        <p class="hero-sub">Create, visualize, and experiment with sound using Web Audio API</p>
    </section>

    <div class="lab-layout">
        <div class="glass-card visualizer-card">
            <canvas id="waveCanvas" width="800" height="200"></canvas>
            <canvas id="freqCanvas" width="800" height="150"></canvas>
        </div>

        <div class="synth-grid">
            <div class="glass-card">
                <h3 class="card-title">🎹 Synthesizer</h3>
                <div class="keyboard" id="keyboard"></div>
                <div class="synth-controls">
                    <div class="control-group">
                        <label>Waveform</label>
                        <div class="wave-btns">
                            <button class="wave-btn active" data-wave="sine">∿ Sine</button>
                            <button class="wave-btn" data-wave="square">⊓ Square</button>
                            <button class="wave-btn" data-wave="sawtooth">⊿ Saw</button>
                            <button class="wave-btn" data-wave="triangle">△ Tri</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>Octave: <span id="octaveVal">4</span></label>
                        <input type="range" id="octave" min="2" max="7" value="4" class="slider">
                    </div>
                    <div class="control-group">
                        <label>Volume: <span id="volVal">70</span>%</label>
                        <input type="range" id="volume" min="0" max="100" value="70" class="slider">
                    </div>
                </div>
            </div>

            <div class="glass-card">
                <h3 class="card-title">🎛️ Effects</h3>
                <div class="control-group">
                    <label>Reverb: <span id="reverbVal">0</span>%</label>
                    <input type="range" id="reverb" min="0" max="100" value="0" class="slider">
                </div>
                <div class="control-group">
                    <label>Delay: <span id="delayVal">0</span>ms</label>
                    <input type="range" id="delay" min="0" max="500" value="0" class="slider">
                </div>
                <div class="control-group">
                    <label>Filter Cutoff: <span id="filterVal">20000</span>Hz</label>
                    <input type="range" id="filter" min="100" max="20000" value="20000" class="slider" step="100">
                </div>
                <div class="control-group">
                    <label>Attack: <span id="attackVal">0.01</span>s</label>
                    <input type="range" id="attack" min="0" max="100" value="1" class="slider">
                </div>
                <div class="control-group">
                    <label>Release: <span id="releaseVal">0.3</span>s</label>
                    <input type="range" id="release" min="1" max="200" value="30" class="slider">
                </div>
            </div>

            <div class="glass-card">
                <h3 class="card-title">🥁 Beat Sequencer</h3>
                <div class="seq-controls">
                    <button class="btn btn-primary" id="seqPlay">▶ Play</button>
                    <button class="btn btn-secondary" id="seqStop">⏹ Stop</button>
                    <div class="control-group" style="flex:1">
                        <label>BPM: <span id="seqBpmVal">120</span></label>
                        <input type="range" id="seqBpm" min="60" max="200" value="120" class="slider">
                    </div>
                </div>
                <div class="sequencer-grid" id="sequencerGrid"></div>
            </div>
        </div>
    </div>
</main>
<footer class="footer"><div class="container footer-inner">
    <div class="footer-brand"><span>🔊 SoundLab</span><p>Part of <a href="https://quickutils.top">QuickUtils</a></p></div>
    <p class="copyright">© 2026 QuickUtils. All rights reserved.</p>
</div></footer>
<script src="script.js"></script>
</body>
</html>
